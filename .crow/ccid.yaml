# Replace 99f65658262db4c2321233ad01e7e1a5f52a406c with one verified ccid commit before committing this adapter.
when:
  - event: manual
skip_clone: true
variables:
  SOURCE_ARCHIVE: {default: ""}
  SOURCE_SHA256: {default: ""}
  CI_TOOL_ARCHIVE: {default: ""}
  CI_TOOL_SHA256: {default: ""}
  CHECKS: {default: catalog}
  CI_JOBS: {default: ""}
  CI_TEST_THREADS: {default: ""}
  CI_MEMORY_MB: {default: ""}
  CI_MEMORY_PER_JOB_MB: {default: ""}
  CI_TIMEOUT: {default: ""}
  CI_CACHE_ROOT: {default: ""}
  CI_NIX_JOBS: {default: ""}
  CI_LINKER: {default: system}
  TMPDIR: {default: ""}
steps:
  - name: selected-checks
    image: bash
    environment:
      CCID_REVISION: '99f65658262db4c2321233ad01e7e1a5f52a406c'
    commands:
      - |
        set -eu
        printf '%s  %s\n' "$CI_TOOL_SHA256" "$CI_TOOL_ARCHIVE" | sha256sum --check --strict
        test "$(git get-tar-commit-id < "$CI_TOOL_ARCHIVE")" = "$CCID_REVISION"
        TMPDIR="${TMPDIR:-${CI_CACHE_ROOT:-${CARGO_HOME:-$HOME/.cargo}/ccid}/tmp}"
        export TMPDIR
        mkdir -p "$TMPDIR"
        ci_tool_dir="$(mktemp -d)"
        ci_source_dir=""
        trap 'rm -rf -- "$ci_tool_dir" "$ci_source_dir"' EXIT
        ci_source_dir="$(mktemp -d)"
        tar --extract --touch --file "$CI_TOOL_ARCHIVE" --no-same-owner --directory "$ci_tool_dir"
        python3 "$ci_tool_dir/ccid.py" verify-source --archive "$SOURCE_ARCHIVE" --sha256 "$SOURCE_SHA256" --commit "$CI_COMMIT_SHA" --destination "$ci_source_dir"
        python3 "$ci_tool_dir/ccid.py" check --repo "$ci_source_dir" --check "$CHECKS"
