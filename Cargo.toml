[package]
name = "cfetch"
version = "0.9.9"
edition = "2024"
rust-version = "1.95"
license = "FSL-1.1-ALv2"
description = "Cited, trust-tiered memory for AI coding agents over plain Markdown"
repository = "https://github.com/corbet-labs/cfetch"
readme = "README.md"
publish = ["crates-io"]
keywords = ["ai-agents", "memory", "mcp", "retrieval", "markdown"]
categories = ["command-line-utilities", "development-tools", "text-processing"]
include = [
  "/src/**",
  "/build.rs",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/docs/local-inference.md",
  "/docs/local-embedding-adapter.md",
  "/docs/ai-maintenance.md",
  "/docs/embedding-profile-v1.md",
  "/docs/retrieval-readiness.md",
  "/LICENSE.md",
  "/THIRD-PARTY-LICENSES.txt",
  "/release/variants.json",
  "/release/inference-backends.json",
]

[dependencies]
# Exact-pinned harness configuration adapter. cfetch decides which surfaces
# are behaviorally compatible; this crate owns per-harness schemas, paths,
# atomic writes, first-touch backups, and ownership ledgers.
agent-config = "=0.4.0"
# Exact-pinned transcript normalizer. cfetch retains its cumulative-ledger
# semantics at the boundary instead of exposing this crate's IR directly.
agent-session = "=0.5.13"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
ignore = "0.4"
iroh = "1.0.3"
# BLAKE3-verified, resumable artifact transfer over the daemon's existing
# authenticated iroh endpoint. We use only the in-memory store and wire
# protocol; cfetch's packed vector store remains the durable record.
iroh-blobs = { version = "=0.103.0", default-features = false }
# Drives iroh-blobs' progress stream so artifact downloads can be stopped at
# the exact profile-derived byte boundary.
n0-future = "0.3"
notify = "8"
# Optional: embedded embedding + reranking via fastembed (ONNX Runtime).
# Zero external dependencies at runtime — models run inside the cfetch binary.
# fastembed handles model download, tokenization, pooling, and caching.
# Enable with: cargo build --features embedded-embeddings
fastembed = {
  version = "6",
  optional = true,
  default-features = false,
  features = [
    "hf-hub-rustls-tls",
    "ort-download-binaries-rustls-tls",
    "image-models"
  ]
}
ratatui = "0.30.2"
# Exact-pinned official MCP SDK. cfetch owns its tools; rmcp owns JSON-RPC,
# protocol negotiation, capability discovery, schemas, and stdio framing.
rmcp = { version = "=3.1.4", default-features = false, features = ["server", "transport-io"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
# Used only by the cfetch 0.9 one-time Codex registration conversion and the
# features.hooks health check. New registrations are owned by agent-config.
toml_edit = "0.25"
tree-sitter = "0.26.12"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
# Embeddings HTTP client only (src/embed.rs). Minimal feature set: rustls for
# https endpoints, no gzip/charset/cookies; redirects are disabled per request
# policy (SSRF hardening), which ureq supports natively.
ureq = { version = "3", default-features = false, features = ["rustls"] }

# flock(2) for the advisory lockfile (src/lockfile.rs) and uname(2) for the
# serving host's origin (src/serve.rs). UNIX ONLY: rustix compiles on Windows
# but exposes neither module there, and both have a std-only Windows
# counterpart (FILE_SHARE_NONE opens, %COMPUTERNAME%), so the dependency
# simply does not exist in a Windows build.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "system"] }

[features]
# Experimental standalone Nomic model probe. Enabling it adds diagnostic
# download/status/test commands, never a producer for cfetch's shared vectors.
embedded-embeddings = ["fastembed"]

[lints.rust]
# cfetch itself is safe Rust on every target. Native implementations may live
# behind dependencies with their own audited safe APIs, but unsafe code cannot
# enter this package's binary, build script, or integration-test targets.
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true

[profile.release-max]
# Self-hosted maximum-performance build: everything `release` carries, plus
# whole-program LTO and single-CGU codegen. The distributed binaries stay on
# the portable `release` baseline — this profile is for a binary that never
# leaves the machine it was built on. See docs/self-build-performance.md.
inherits = "release"
lto = "fat"
codegen-units = 1
