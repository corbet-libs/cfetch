name: Publish to Homebrew tap

# Automatic updates begin after the exact GitHub release is public. Manual
# updates retain support for older public releases without retained bundles.
on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      source_commit:
        required: true
        type: string
    secrets:
      PACKAGES_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v-prefix (e.g. 0.9.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cfetch-homebrew
  cancel-in-progress: false

jobs:
  homebrew:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve version
        id: ver
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          version="$REQUESTED_VERSION"
          if [ -z "$version" ]; then
            version="${REQUESTED_TAG#v}"
          fi
          version=$(python3 scripts/release_maintenance.py version --version "$version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Inspect the exact public release once
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/cfetch-homebrew"
          gh release view "v$VERSION" --repo corbet-labs/cfetch \
            --json tagName,isDraft,isPrerelease,assets > "$RUNNER_TEMP/cfetch-homebrew/release.json"
          gh api "repos/corbet-labs/cfetch/git/ref/tags/v$VERSION" \
            --jq .object > "$RUNNER_TEMP/cfetch-homebrew/tag.json"
          for ((attempt=0; attempt<5; attempt++)); do
            type=$(jq -r .type "$RUNNER_TEMP/cfetch-homebrew/tag.json")
            if [ "$type" = commit ]; then break; fi
            test "$type" = tag
            object=$(jq -er '.sha | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/cfetch-homebrew/tag.json")
            gh api "repos/corbet-labs/cfetch/git/tags/$object" \
              --jq .object > "$RUNNER_TEMP/cfetch-homebrew/tag-next.json"
            mv "$RUNNER_TEMP/cfetch-homebrew/tag-next.json" "$RUNNER_TEMP/cfetch-homebrew/tag.json"
          done
          gh release download "v$VERSION" --repo corbet-labs/cfetch \
            --pattern checksums_sha256.txt --pattern variants.json \
            --dir "$RUNNER_TEMP/cfetch-homebrew"

      - name: Render and validate the formula before requesting tap access
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          EXPECTED_COMMIT: ${{ inputs.source_commit }}
        run: |
          python3 scripts/release_maintenance.py homebrew-metadata \
            --version "$VERSION" --expected-commit "$EXPECTED_COMMIT" \
            --metadata "$RUNNER_TEMP/cfetch-homebrew" \
            --output "$RUNNER_TEMP/cfetch-homebrew/cfetch.rb"

      - name: Require tap write credential
        env:
          TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          test -n "$TOKEN" || {
            echo "::error::PACKAGES_TOKEN needs Contents write access to corbet-labs/homebrew-cfetch."
            exit 1
          }

      - name: Check out tap repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: corbet-labs/homebrew-cfetch
          token: ${{ secrets.PACKAGES_TOKEN }}
          path: tap

      - name: Commit and push formula
        working-directory: tap
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p Formula
          cp "$RUNNER_TEMP/cfetch-homebrew/cfetch.rb" Formula/cfetch.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/cfetch.rb
          if git diff --cached --quiet; then
            echo "Formula already matches $VERSION"
          else
            git commit -m "formula: bump cfetch to $VERSION"
            git push origin HEAD:main
          fi
