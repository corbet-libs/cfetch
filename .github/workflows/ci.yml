# Test + lint gate. Push is limited to main so a pull request runs once, not
# twice. No secrets are used anywhere in this workflow.
#
# All three platforms remain supported and blocking for release validation.
# macOS runs on release tags or explicit dispatch; Windows also runs on main.
# Routine pull requests use Linux. A Linux pass is not a native-platform verdict.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: [README.md, ARCHITECTURE.md, "docs/**"]
  pull_request:
    paths-ignore: [README.md, ARCHITECTURE.md, "docs/**"]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_checks:
        type: boolean
        default: false
      release_source_sha256:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !inputs.release_checks }}

env:
  CARGO_BUILD_JOBS: "1"
  RUST_TEST_THREADS: "1"

jobs:
  catalog:
    name: Variant catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
      has_variants: ${{ steps.catalog.outputs.has_variants }}
    steps:
      - name: Preserve committed checkout bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: inputs.release_checks
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: inputs.release_checks
        with:
          name: release-plan
          path: ${{ runner.temp }}/cfetch-plan
      - name: Retain exact shared release source
        if: inputs.release_checks
        shell: bash
        env:
          PLAN_SOURCE_SHA256: ${{ inputs.release_source_sha256 }}
        run: |
          {
            echo "RELEASE_ARTIFACT_DIR=$RUNNER_TEMP/cfetch-release"
            echo "RELEASE_SOURCE_ARCHIVE=$RUNNER_TEMP/cfetch-plan/source.tar"
            echo "RELEASE_SOURCE_SHA256=$PLAN_SOURCE_SHA256"
          } >> "$GITHUB_ENV"
      - name: Validate and export matrix
        id: catalog
        env:
          RELEASE_CHECKS: ${{ inputs.release_checks }}
        shell: bash
        run: |
          if [[ "$RELEASE_CHECKS" == true ]]; then
            python scripts/release.py check catalog
          else
            bash scripts/ci-check.sh catalog
          fi
          matrix=$(bash scripts/variant-matrix.sh)
          # Filter before matrix expansion so omitted platforms allocate no runner.
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            workflow_dispatch:*|release:*|*:refs/tags/*) ;;
            push:refs/heads/main|push:refs/heads/master)
              matrix=$(jq -c '.include |= map(select(.os != "mac"))' <<< "$matrix") ;;
            *)
              matrix=$(jq -c '.include |= map(select(.os != "mac" and .os != "win"))' <<< "$matrix") ;;
          esac
          jq -e '.include | length > 0' <<< "$matrix" >/dev/null
          if [[ "$RELEASE_CHECKS" == true ]]; then
            # Native release preparation builds and smokes admitted rows once.
            # Keep unadmitted candidates in CI; they are not release artifacts.
            admitted=$(bash scripts/variant-matrix.sh --release)
            matrix=$(jq -c --argjson admitted "$admitted" '.include |= map(select(.id as $id | $admitted.include | map(.id) | index($id) | not))' <<< "$matrix")
          fi
          echo "has_variants=$(jq -r '.include | length > 0' <<< "$matrix")" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Retain verified release check
        if: inputs.release_checks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-check-catalog-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/cfetch-release/source.tar
            ${{ runner.temp }}/cfetch-release/plan.json
            ${{ runner.temp }}/cfetch-release/checks/*.json
          if-no-files-found: error
          retention-days: 30
  variant-build:
    name: Variant build (${{ matrix.id }})
    needs: catalog
    if: needs.catalog.outputs.has_variants == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Preserve committed checkout bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Reuse native variant dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          shared-key: variant-${{ matrix.id }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check exact release build
        shell: bash
        run: |
          export CFETCH_VARIANT='${{ matrix.id }}'
          if [ -n "${{ matrix.target }}" ]; then
            cargo check --release --locked --target "${{ matrix.target }}" --features '${{ matrix.cargo_features }}'
          else
            cargo check --release --locked --features '${{ matrix.cargo_features }}'
          fi

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Preserve committed checkout bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: inputs.release_checks
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: inputs.release_checks
        with:
          name: release-plan
          path: ${{ runner.temp }}/cfetch-plan
      - name: Retain exact shared release source
        if: inputs.release_checks
        shell: bash
        env:
          PLAN_SOURCE_SHA256: ${{ inputs.release_source_sha256 }}
        run: |
          {
            echo "RELEASE_ARTIFACT_DIR=$RUNNER_TEMP/cfetch-release"
            echo "RELEASE_SOURCE_ARCHIVE=$RUNNER_TEMP/cfetch-plan/source.tar"
            echo "RELEASE_SOURCE_SHA256=$PLAN_SOURCE_SHA256"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.2
          fallback: none
      - name: Enforce dependency policy and exact notices
        shell: bash
        env:
          RELEASE_CHECKS: ${{ inputs.release_checks }}
        run: |
          if [[ "$RELEASE_CHECKS" == true ]]; then
            python scripts/release.py check licenses
          else
            bash scripts/ci-check.sh licenses
          fi

      - name: Retain verified release check
        if: inputs.release_checks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-check-licenses-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/cfetch-release/source.tar
            ${{ runner.temp }}/cfetch-release/plan.json
            ${{ runner.temp }}/cfetch-release/checks/*.json
          if-no-files-found: error
          retention-days: 30
  embedding-profile-policy:
    name: Embedding profile policy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Preserve committed checkout bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: inputs.release_checks
        with:
          name: release-plan
          path: ${{ runner.temp }}/cfetch-plan
      - name: Retain exact shared release source
        if: inputs.release_checks
        shell: bash
        env:
          PLAN_SOURCE_SHA256: ${{ inputs.release_source_sha256 }}
        run: |
          {
            echo "RELEASE_ARTIFACT_DIR=$RUNNER_TEMP/cfetch-release"
            echo "RELEASE_SOURCE_ARCHIVE=$RUNNER_TEMP/cfetch-plan/source.tar"
            echo "RELEASE_SOURCE_SHA256=$PLAN_SOURCE_SHA256"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/embedding-profile/requirements-lock.txt
      - name: Install the fully hashed policy environment
        run: python -m pip install --require-hashes -r experiments/embedding-profile/requirements-lock.txt
      - name: Verify embedding profile contracts and retained admission evidence
        shell: bash
        env:
          RELEASE_CHECKS: ${{ inputs.release_checks }}
        run: |
          if [[ "$RELEASE_CHECKS" == true ]]; then
            python scripts/release.py check profile
          else
            bash scripts/ci-check.sh profile
          fi

      - name: Retain verified release check
        if: inputs.release_checks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-check-profile-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/cfetch-release/source.tar
            ${{ runner.temp }}/cfetch-release/plan.json
            ${{ runner.temp }}/cfetch-release/checks/*.json
          if-no-files-found: error
          retention-days: 30
  test:
    name: Test (${{ matrix.os }})
    strategy:
      # Keep every platform's result visible even when one fails.
      fail-fast: false
      max-parallel: 2
      # macOS: manual/tag/release. Windows: main push plus manual/tag/release; PR uses Linux.
      # Eligible hosted Linux Rust coverage runs on PR/main as well as native gates.
      matrix: >-
        ${{ fromJSON((inputs.release_checks || github.event_name == 'workflow_dispatch' || github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')) && '{"os":["ubuntu-latest","macos-latest","windows-latest"]}' || github.event_name == 'push' && '{"os":["ubuntu-latest","windows-latest"]}' || '{"os":["ubuntu-latest"]}') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Preserve committed checkout bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: inputs.release_checks
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: inputs.release_checks
        with:
          name: release-plan
          path: ${{ runner.temp }}/cfetch-plan
      - name: Retain exact shared release source
        if: inputs.release_checks
        shell: bash
        env:
          PLAN_SOURCE_SHA256: ${{ inputs.release_source_sha256 }}
        run: |
          {
            echo "RELEASE_ARTIFACT_DIR=$RUNNER_TEMP/cfetch-release"
            echo "RELEASE_SOURCE_ARCHIVE=$RUNNER_TEMP/cfetch-plan/source.tar"
            echo "RELEASE_SOURCE_SHA256=$PLAN_SOURCE_SHA256"
          } >> "$GITHUB_ENV"
      - name: Verify release planning on this native platform before compilation
        shell: bash
        run: RELEASE_ARTIFACT_DIR="$RUNNER_TEMP/cfetch-native-plan" python scripts/release.py plan
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          shared-key: test-${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Locked tests, feature combinations, diagnostics and Clippy
        shell: bash
        env:
          RELEASE_CHECKS: ${{ inputs.release_checks }}
        run: |
          if [[ "$RELEASE_CHECKS" == true ]]; then
            python scripts/release.py check rust
          else
            bash scripts/ci-check.sh rust
          fi
      - name: Retain verified release check
        if: inputs.release_checks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-check-rust-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/cfetch-release/source.tar
            ${{ runner.temp }}/cfetch-release/plan.json
            ${{ runner.temp }}/cfetch-release/checks/*.json
          if-no-files-found: error
          retention-days: 30
