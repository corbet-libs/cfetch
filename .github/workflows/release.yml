# One gate graph produces retained bytes before any publication credentials exist.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: "1"
  RUST_TEST_THREADS: "1"
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  plan:
    if: github.event.repository.private == false && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      source_sha256: ${{ steps.plan.outputs.source_sha256 }}
    steps:
      - name: Preserve committed checkout bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select the complete admitted native matrix
        id: plan
        shell: bash
        run: |
          export RELEASE_ARTIFACT_DIR="$RUNNER_TEMP/cfetch-release"
          matrix=$(python scripts/release.py plan)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "source_sha256=$(sha256sum "$RELEASE_ARTIFACT_DIR/source.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-plan
          path: ${{ runner.temp }}/cfetch-release/
          if-no-files-found: error
          retention-days: 30

  gates:
    needs: plan
    uses: ./.github/workflows/ci.yml
    with:
      release_checks: true
      release_source_sha256: ${{ needs.plan.outputs.source_sha256 }}

  native:
    needs: [plan, gates]
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Preserve committed checkout bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          # Match the complete native dependency cache produced by CI.
          prefix-key: v1-rust-ort
          shared-key: variant-${{ matrix.id }}
          cache-directories: ${{ runner.temp }}/cfetch-ort
          cache-bin: false
          save-if: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-plan
          path: ${{ runner.temp }}/cfetch-plan
      - name: Use the exact shared plan source
        shell: bash
        env:
          PLAN_SOURCE_SHA256: ${{ needs.plan.outputs.source_sha256 }}
        run: |
          {
            echo "RELEASE_SOURCE_ARCHIVE=$RUNNER_TEMP/cfetch-plan/source.tar"
            echo "RELEASE_SOURCE_SHA256=$PLAN_SOURCE_SHA256"
          } >> "$GITHUB_ENV"
      - name: Build, stage, smoke and retain exact native bytes
        shell: bash
        env:
          RELEASE_VARIANT: ${{ matrix.id }}
          ORT_CACHE_DIR: ${{ runner.temp }}/cfetch-ort
        run: |
          export RELEASE_ARTIFACT_DIR="$RUNNER_TEMP/cfetch-release"
          python scripts/release.py prepare "$RELEASE_VARIANT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-native-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/cfetch-release/${{ matrix.id }}/*.json
            ${{ runner.temp }}/cfetch-release/${{ matrix.id }}/*.tar.gz
            ${{ runner.temp }}/cfetch-release/${{ matrix.id }}/*.zip
          if-no-files-found: error
          retention-days: 30

  crate:
    needs: [plan, gates]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Preserve committed checkout bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          shared-key: test-Linux-X64
          cache-bin: false
          save-if: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-plan
          path: ${{ runner.temp }}/cfetch-plan
      - name: Use the exact shared plan source
        shell: bash
        env:
          PLAN_SOURCE_SHA256: ${{ needs.plan.outputs.source_sha256 }}
        run: |
          {
            echo "RELEASE_SOURCE_ARCHIVE=$RUNNER_TEMP/cfetch-plan/source.tar"
            echo "RELEASE_SOURCE_SHA256=$PLAN_SOURCE_SHA256"
          } >> "$GITHUB_ENV"
      - name: Verify the exact Cargo upload archive without credentials
        shell: bash
        run: |
          export RELEASE_ARTIFACT_DIR="$RUNNER_TEMP/cfetch-release"
          python scripts/release.py prepare cargo
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-crate
          path: ${{ runner.temp }}/cfetch-release/cargo/
          if-no-files-found: error
          retention-days: 30

  verify:
    needs: [gates, native, crate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha256: ${{ steps.verify.outputs.sha256 }}
    steps:
      - name: Preserve committed checkout bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: corbet-libs/ccid
          ref: ab4303e2c133220972114a651cc52cf0f1550999
          path: .ci-tool-source
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-*
          path: ${{ runner.temp }}/cfetch-staged
      - name: Verify producing source, complete gates and exact artifact bytes
        id: verify
        shell: bash
        run: |
          export RELEASE_ARTIFACT_DIR="$RUNNER_TEMP/cfetch-release"
          export CI_TOOL_ARCHIVE="$RUNNER_TEMP/ccid.tar"
          test "$(git -C .ci-tool-source rev-parse HEAD)" = ab4303e2c133220972114a651cc52cf0f1550999
          git -C .ci-tool-source archive --format=tar HEAD > "$CI_TOOL_ARCHIVE"
          export CI_TOOL_SHA256
          CI_TOOL_SHA256=$(sha256sum "$CI_TOOL_ARCHIVE" | cut -d' ' -f1)
          python scripts/release.py verify --input "$RUNNER_TEMP/cfetch-staged" > "$RUNNER_TEMP/release-result.json"
          echo "sha256=$(jq -r .sha256 "$RUNNER_TEMP/release-result.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-bundle
          path: |
            ${{ runner.temp }}/cfetch-release/*.tar
            ${{ runner.temp }}/release-result.json
          if-no-files-found: error
          retention-days: 30

  github:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Preserve committed checkout bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: corbet-libs/ccid
          ref: ab4303e2c133220972114a651cc52cf0f1550999
          path: .ci-tool-source
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-bundle
          path: ${{ runner.temp }}/cfetch-input
      - name: Establish verified public handoff paths
        shell: bash
        env:
          BUNDLE_SHA256: ${{ needs.verify.outputs.sha256 }}
        run: |
          test "$(git -C .ci-tool-source rev-parse HEAD)" = ab4303e2c133220972114a651cc52cf0f1550999
          git -C .ci-tool-source archive --format=tar HEAD > "$RUNNER_TEMP/ccid.tar"
          {
            echo "CI_TOOL_ARCHIVE=$RUNNER_TEMP/ccid.tar"
            echo "CI_TOOL_SHA256=$(sha256sum "$RUNNER_TEMP/ccid.tar" | cut -d' ' -f1)"
            echo "RELEASE_ARTIFACT_DIR=$RUNNER_TEMP/cfetch-release"
            echo "RELEASE_JOURNAL_ROOT=$RUNNER_TEMP/cfetch-journal"
            echo "RELEASE_BUNDLE=$RUNNER_TEMP/cfetch-input/cfetch-release/cfetch-${RELEASE_TAG}-bundle.tar"
            echo "RELEASE_BUNDLE_SHA256=$BUNDLE_SHA256"
          } >> "$GITHUB_ENV"
      - name: Create draft, reconcile/upload exact assets, then make it public
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release.py create
          python scripts/release.py publish github
          python scripts/release.py finish github
      - name: Retain publication and creation intents even after uncertainty
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-github-journal-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cfetch-journal/
          if-no-files-found: ignore
          retention-days: 90

  homebrew:
    needs: github
    uses: ./.github/workflows/homebrew.yml
    with:
      release_tag: ${{ github.ref_name }}
      source_commit: ${{ github.sha }}
    secrets:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

  cargo:
    needs: [verify, github]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Preserve committed checkout bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: corbet-libs/ccid
          ref: ab4303e2c133220972114a651cc52cf0f1550999
          path: .ci-tool-source
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-bundle
          path: ${{ runner.temp }}/cfetch-input
      - name: Establish verified public handoff paths
        shell: bash
        env:
          BUNDLE_SHA256: ${{ needs.verify.outputs.sha256 }}
        run: |
          test "$(git -C .ci-tool-source rev-parse HEAD)" = ab4303e2c133220972114a651cc52cf0f1550999
          git -C .ci-tool-source archive --format=tar HEAD > "$RUNNER_TEMP/ccid.tar"
          {
            echo "CI_TOOL_ARCHIVE=$RUNNER_TEMP/ccid.tar"
            echo "CI_TOOL_SHA256=$(sha256sum "$RUNNER_TEMP/ccid.tar" | cut -d' ' -f1)"
            echo "RELEASE_ARTIFACT_DIR=$RUNNER_TEMP/cfetch-release"
            echo "RELEASE_JOURNAL_ROOT=$RUNNER_TEMP/cfetch-journal"
            echo "RELEASE_BUNDLE=$RUNNER_TEMP/cfetch-input/cfetch-release/cfetch-${RELEASE_TAG}-bundle.tar"
            echo "RELEASE_BUNDLE_SHA256=$BUNDLE_SHA256"
          } >> "$GITHUB_ENV"
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
        id: auth
      - name: Publish the verified archive without compilation or repackaging
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASE_CARGO_AUTH: trusted
        run: python scripts/release.py publish cargo
      - name: Retain Cargo publication intent
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-cargo-journal-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cfetch-journal/
          if-no-files-found: ignore
          retention-days: 90
