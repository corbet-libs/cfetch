name: Inspect patch preparation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patch-plan:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare an exact patch without changing the checkout, main or tags
        run: |
          git bundle create "$RUNNER_TEMP/cfetch-history.bundle" --all
          export MAINTENANCE_HISTORY_BUNDLE="$RUNNER_TEMP/cfetch-history.bundle"
          MAINTENANCE_HISTORY_SHA256=$(sha256sum "$MAINTENANCE_HISTORY_BUNDLE" | cut -d' ' -f1)
          export MAINTENANCE_HISTORY_SHA256
          export RELEASE_ARTIFACT_DIR="$RUNNER_TEMP/cfetch-maintenance"
          python3 scripts/release_maintenance.py patch-plan
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: patch-plan
          path: ${{ runner.temp }}/cfetch-maintenance/
          if-no-files-found: error
          retention-days: 30
