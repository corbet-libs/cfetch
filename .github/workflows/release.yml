# Tag v* -> GitHub release with endpoint variants and admitted local packages.
# Every archive contains the binary, cfetch's license and the generated
# third-party license/NOTICE bundle. Uses only the workflow's own GITHUB_TOKEN
# (via the contents: write permission) — no configured secrets.
#
# The backend is part of every artifact name. Today every real build is the
# endpoint-only `remote` flavor. Candidate targets remain in the executable
# catalog and normal build CI; only admitted local packages enter a release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  preflight:
    name: Validate release policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject 1.0+ and mismatched tags
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          tag_version=${GITHUB_REF_NAME#v}
          test "$tag_version" = "$version" || {
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          }
          case "$version" in
            0.*) ;;
            *) echo "cfetch 1.0+ is operator-blocked (requested $version)" >&2; exit 1 ;;
          esac

  catalog:
    name: Load executable variant catalog
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate and export matrix
        id: catalog
        shell: bash
        run: |
          python -m unittest -v scripts.test_variant_matrix
          matrix=$(bash scripts/variant-matrix.sh --release)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.id }})
    needs: [preflight, catalog]
    strategy:
      # One platform failing must not silently ship a partial release; every
      # platform's result stays visible and the publish job gates on all.
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        shell: bash
        run: |
          export CFETCH_VARIANT='${{ matrix.id }}'
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --locked --target "${{ matrix.target }}" --features '${{ matrix.cargo_features }}'
          else
            cargo build --release --locked --features '${{ matrix.cargo_features }}'
          fi
      - name: Stage artifact
        shell: bash
        run: |
          package="${{ matrix.id }}-${GITHUB_REF_NAME}"
          mkdir -p "dist/$package"
          if [ -n "${{ matrix.target }}" ]; then
            cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/$package/${{ matrix.binary }}"
          else
            cp "target/release/${{ matrix.binary }}" "dist/$package/${{ matrix.binary }}"
          fi
          cp LICENSE.md THIRD-PARTY-LICENSES.txt release/variants.json \
            release/inference-backends.json "dist/$package/"
          python scripts/stage_local_inference.py \
            --registry release/inference-backends.json \
            --catalog release/variants.json \
            --variant '${{ matrix.id }}' \
            --destination "dist/$package"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && 7z a "$package.zip" "$package" >/dev/null)
          else
            (cd dist && tar -czf "$package.tar.gz" "$package")
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.id }}
          path: dist/${{ matrix.id }}-${{ github.ref_name }}.*
          if-no-files-found: error

  publish:
    # Gates on every platform: a release that is missing a supported platform
    # is a broken promise, not a partial success.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: staged
      - name: Collect
        run: |
          mkdir -p dist
          find staged -type f -exec cp {} dist/ \;
          cp LICENSE.md dist/LICENSE.md
          cp THIRD-PARTY-LICENSES.txt dist/THIRD-PARTY-LICENSES.txt
          cp release/variants.json dist/variants.json
          cp release/inference-backends.json dist/inference-backends.json
          ls -la dist
      # Published as a release asset because downstream packaging consumes it
      # rather than re-hashing: the Homebrew tap regenerates its formula from
      # these lines, and a formula whose sha256 came from anywhere but the
      # released bytes is a formula that can silently install something else.
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > "$RUNNER_TEMP/checksums_sha256.txt"
          mv "$RUNNER_TEMP/checksums_sha256.txt" .
          cat checksums_sha256.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true

  publish-crate:
    # crates.io publication is irreversible, so it follows the complete,
    # all-platform GitHub release rather than racing the artifact builds.
    name: Publish crate
    needs: publish
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate to crates.io with GitHub OIDC
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
