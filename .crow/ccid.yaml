# Replace 99f65658262db4c2321233ad01e7e1a5f52a406c with one verified ccid commit before committing this adapter.
when:
  - event: manual
skip_clone: true
variables:
  SOURCE_ARCHIVE: {default: ""}
  SOURCE_SHA256: {default: ""}
  CI_TOOL_ARCHIVE: {default: ""}
  CI_TOOL_SHA256: {default: ""}
  CHECKS: {default: catalog}
  CFETCH_POLICY_PYTHON: {default: python3}
  CFETCH_FOUNDATION_BUNDLE: {default: ""}
  CFETCH_FOUNDATION_OUTPUT: {default: ""}
  CFETCH_FOUNDATION_MODEL: {default: ""}
  CFETCH_FOUNDATION_RETAINED_ROOT: {default: ""}
  CFETCH_FOUNDATION_PROBE_DIR: {default: ""}
  CFETCH_FOUNDATION_CPU_DIAGNOSTIC: {default: ""}
  CFETCH_FOUNDATION_CPU_INPUT: {default: ""}
  CFETCH_FOUNDATION_CPU_INPUT_SHA256: {default: ""}
  CFETCH_FOUNDATION_PKG_CONFIG: {default: ""}
  CFETCH_FOUNDATION_OPENSSL_DEV: {default: ""}
  CI_JOBS: {default: ""}
  CI_TEST_THREADS: {default: ""}
  CI_MEMORY_MB: {default: ""}
  CI_MEMORY_PER_JOB_MB: {default: ""}
  CI_TIMEOUT: {default: ""}
  CI_CACHE_ROOT: {default: ""}
  CI_NIX_JOBS: {default: ""}
  CI_LINKER: {default: system}
  TMPDIR: {default: ""}
  CI_TOOL_BINARY: {default: ""}
  CI_TOOL_BINARY_SHA256: {default: ""}
  CI_MIN_AVAILABLE_MB: {default: "8192"}
  CI_REPOSITORY_URL: {default: ""}
  CARGO_TARGET_DIR: {default: ""}
steps:
  - name: selected-checks
    image: bash
    environment:
      CCID_REVISION: '0d26838935e59dd3d7bc431decb86b067f150d59'
    commands:
      - |
        set -eu
        printf '%s  %s\n' "$CI_TOOL_SHA256" "$CI_TOOL_ARCHIVE" | sha256sum --check --strict
        test "$(git get-tar-commit-id < "$CI_TOOL_ARCHIVE")" = "$CCID_REVISION"
        test -n "$CI_TOOL_BINARY"
        test -n "$CI_TOOL_BINARY_SHA256"
        printf '%s  %s\n' "$CI_TOOL_BINARY_SHA256" "$CI_TOOL_BINARY" | sha256sum --check --strict
        test "$("$CI_TOOL_BINARY" source-revision)" = "$CCID_REVISION"
        TMPDIR="$${TMPDIR:-/tmp}"
        export TMPDIR
        exec "$CI_TOOL_BINARY" check --archive "$SOURCE_ARCHIVE" --sha256 "$SOURCE_SHA256" --commit "$CI_COMMIT_SHA" --check "$CHECKS"
