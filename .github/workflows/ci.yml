# Test + lint gate. Push is limited to main so a pull request runs once, not
# twice. No secrets are used anywhere in this workflow.
#
# All three platforms are SUPPORTED and blocking: test + clippy must pass on
# Linux, macOS and Windows. Windows was promoted out of its experimental job
# on 2026-08-21, the first run where it went green — the PRD makes a failing
# platform a release blocker once its port has landed, and the port has.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  catalog:
    name: Variant catalog
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate and export matrix
        id: catalog
        shell: bash
        run: |
          bash scripts/check-packaging-variants.sh
          echo "matrix=$(bash scripts/variant-matrix.sh)" >> "$GITHUB_OUTPUT"
      - name: Test exact local payload staging
        run: python -m unittest -v scripts.test_stage_local_inference
      - name: Test admitted release matrix
        run: python -m unittest -v scripts.test_variant_matrix

  variant-build:
    name: Variant build (${{ matrix.id }})
    needs: catalog
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check exact release build
        shell: bash
        run: |
          export CFETCH_VARIANT='${{ matrix.id }}'
          if [ -n "${{ matrix.target }}" ]; then
            cargo check --release --locked --target "${{ matrix.target }}" --features '${{ matrix.cargo_features }}'
          else
            cargo check --release --locked --features '${{ matrix.cargo_features }}'
          fi

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2.87.1
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.2
          fallback: none
      - name: Enforce dependency-license and advisory policy
        run: cargo deny check advisories licenses
      - name: Verify third-party notices are current
        run: |
          generated=$(mktemp)
          bash scripts/generate-third-party-licenses.sh "$generated"
          diff -u THIRD-PARTY-LICENSES.txt "$generated"

  embedding-profile-policy:
    name: Embedding profile policy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/embedding-profile/requirements-lock.txt
      - name: Install the fully hashed policy environment
        run: python -m pip install --require-hashes -r experiments/embedding-profile/requirements-lock.txt
      - name: Test canonical codec, adapter export, and all-pairs admission
        working-directory: experiments/embedding-profile
        run: >-
          python -m unittest -v
          test_cross_backend_eval.py
          test_export_adapter_cache.py
          test_kat_host_runner.py
          test_measurement_bundle.py
          test_physical_evidence.py
          test_openvino_scope_keys.py
          test_scifact_contract.py
          test_final_package_conformance.py
          test_admission_transaction.py
      - name: Test dependency-light OpenVINO package contracts
        run: python -m unittest discover -s packages/openvino/tests -v
      - name: Test isolated memory measurement checkpoints
        run: python -m unittest discover -s experiments/memory-retrieval -v
      - name: Test dependency-light activation promotion
        run: python -m unittest scripts/test_apply_admission_activation.py -v
      - name: Verify the pinned SciFact dataset contract
        working-directory: experiments/embedding-profile
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python scifact_contract.py
      - name: Verify the exact admission implementation bundle
        working-directory: experiments/embedding-profile
        run: python cross_backend_eval.py --verify-implementation-bundle
      - name: Replay every admitted release scope
        working-directory: experiments/embedding-profile
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python cross_backend_eval.py --verify-release-registry
      - name: Keep command help dependency-light
        run: |
          python experiments/embedding-profile/export_adapter_cache.py --help >/dev/null
          python experiments/embedding-profile/cross_backend_eval.py --help >/dev/null
          python experiments/embedding-profile/final_package_conformance.py --help >/dev/null
          python experiments/embedding-profile/admission_transaction.py --help >/dev/null
          python experiments/embedding-profile/physical_evidence.py --help >/dev/null
          python scripts/apply_admission_activation.py --help >/dev/null

  test:
    name: Test (${{ matrix.os }})
    strategy:
      # Keep every platform's result visible even when one fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Enforce the operator's pre-1.0 lock
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          case "$version" in
            0.*) ;;
            *) echo "cfetch 1.0+ is operator-blocked (Cargo.toml has $version)" >&2; exit 1 ;;
          esac
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test
        run: cargo test --locked
      - name: Check feature combinations
        run: cargo check --all-targets --all-features --locked
      - name: Test isolated FastEmbed diagnostics
        run: |
          cargo test --locked --features embedded-embeddings --test embed_model_cli
          cargo test --locked --features embedded-embeddings embedded_embed::tests
      - name: Clippy (zero warnings)
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
